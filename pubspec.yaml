name: playon
description: PlayOn - Music Player App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.12
  audio_session: ^0.2.4

  # File system & permissions
  permission_handler: ^12.0.3
  on_audio_query: ^2.9.0
  youtube_explode_dart:
    git:
      url: https://github.com/elias001011/youtube_explode_dart.git
      ref: fix/playlist-lockup-view-model

  # State management
  provider: ^6.1.2

  # UI
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: 2.3.3+2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
